# Build-time pacman.conf for the archiso profile.
# This is only used while mkarchiso constructs the image; it is not shipped
# in the live/installed system (see airootfs/etc/pacman.conf for that).

[options]
Architecture = auto
CheckSpace

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Local repo containing our custom ai-assistant package.
# Built by scripts/build-local-repo.sh before mkarchiso runs.
[aibase-local]
SigLevel = Optional TrustAll
Server = file:///tmp/aibase-local-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

