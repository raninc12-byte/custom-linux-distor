[project]
name = "ai-assistant"
version = "0.1.0"
description = "Local AI assistant tray app for AI-Base Linux (talks to local Ollama)"
requires-python = ">=3.11"
dependencies = [
    "requests",
]

[project.scripts]
ai-assistant = "ai_assistant.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest"]
