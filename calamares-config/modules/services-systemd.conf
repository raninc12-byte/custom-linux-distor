# Ensures aibase-plymouth-setup / aibase-gpu-detect / aibase-first-boot-setup /
# ollama.service units (already symlinked into the squashfs image by
# scripts/enable-services.sh) are left enabled on the target install.
# aibase-gpu-detect installs the proprietary NVIDIA driver automatically at
# runtime for older cards unsupported by nvidia-open, so no manual driver
# choice or EULA click-through is needed here.
services:
  - name: "NetworkManager"
    mandatory: true
  - name: "lightdm"
    mandatory: true
  - name: "aibase-plymouth-setup"
    mandatory: false
  - name: "aibase-gpu-detect"
    mandatory: false
  - name: "aibase-first-boot-setup"
    mandatory: false
