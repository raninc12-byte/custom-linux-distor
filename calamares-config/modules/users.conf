# Standard Calamares users module - creates the primary user account.
# The new user automatically gets ~/.config/autostart/ai-assistant.desktop
# and the rest of /etc/skel, so the AI assistant tray app runs on first
# login without any extra setup step.
defaultGroups:
  - wheel
  - storage
  - power
  - network
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
passwordRequirements:
  minLength: 4
